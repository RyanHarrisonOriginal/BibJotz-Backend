summary: List available Bible translations
responses:
  '200':
    description: Translations
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              name:
                type: string
              license:
                type: string
                nullable: true
              language:
                type: string
                nullable: true
  '500':
    description: Server error
