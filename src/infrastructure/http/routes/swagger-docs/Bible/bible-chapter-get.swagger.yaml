summary: Get chapter metadata (verse count)
parameters:
  - name: bookName
    in: path
    required: true
    schema:
      type: string
  - name: chapterNumber
    in: path
    required: true
    schema:
      type: integer
responses:
  '200':
    description: Chapter info
    content:
      application/json:
        schema:
          type: object
          properties:
            book:
              type: string
            chapter:
              type: integer
            numberOfVerses:
              type: integer
  '404':
    description: Chapter not found
  '500':
    description: Server error
