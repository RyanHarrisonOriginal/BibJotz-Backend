get:
  tags:
    - Search
  summary: Search people and public notes
  description: >
    Search users by display name or username, and notes the viewer is allowed to read,
    by content or book name.
  security:
    - bearerAuth: []
  parameters:
    - in: query
      name: q
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
      description: Search text
    - in: query
      name: type
      required: false
      schema:
        type: string
        enum: [all, people, notes]
        default: all
      description: Restrict results to people, notes, or both
    - in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  responses:
    '200':
      description: Matching people and/or notes
      content:
        application/json:
          schema:
            type: object
            properties:
              people:
                type: array
                items:
                  type: object
              notes:
                type: array
                items:
                  type: object
    '400':
      description: Invalid query
    '401':
      description: Unauthorized
