summary: Soft-delete a comment
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
  - name: userId
    in: query
    required: true
    schema:
      type: integer
    description: Comment author or note owner
responses:
  '204':
    description: Deleted
  '400':
    description: Not allowed
  '404':
    description: Comment not found
  '500':
    description: Server error
