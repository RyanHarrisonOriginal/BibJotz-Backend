summary: Add a comment to a note
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [userId, content]
        properties:
          userId:
            type: integer
          content:
            type: string
            maxLength: 1000
responses:
  '201':
    description: Comment created
  '400':
    description: Validation or not allowed
  '404':
    description: Note or user not found
  '500':
    description: Server error
