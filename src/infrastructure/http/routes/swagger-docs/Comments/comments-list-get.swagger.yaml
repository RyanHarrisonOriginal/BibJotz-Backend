summary: List comments on a note
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
  - name: viewerUserId
    in: query
    required: false
    schema:
      type: integer
    description: Needed to view comments on feed-shared (non-profile) notes
responses:
  '200':
    description: Comments
  '400':
    description: Not allowed or validation error
  '404':
    description: Note not found
  '500':
    description: Server error
