summary: List comments on a note
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
  - name: viewerUserId
    in: query
    required: false
    schema:
      type: integer
    description: Authenticated viewer. Hidden notes return the same 404 as a missing note.
responses:
  '200':
    description: Comments
  '400':
    description: Validation error
  '404':
    description: Note not found
  '500':
    description: Server error
