summary: List notes for a user, optionally filtered by scripture location
parameters:
  - name: userId
    in: query
    required: true
    schema:
      type: integer
  - name: book
    in: query
    required: false
    schema:
      type: string
  - name: chapter
    in: query
    required: false
    schema:
      type: integer
  - name: scope
    in: query
    required: false
    schema:
      type: string
      enum: [BOOK, CHAPTER, VERSE, VERSE_RANGE, VERSE_SET]
responses:
  '200':
    description: Notes newest first
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              userId:
                type: integer
              content:
                type: string
              bookName:
                type: string
              bookShortName:
                type: string
              chapter:
                type: integer
                nullable: true
              startVerse:
                type: integer
                nullable: true
              endVerse:
                type: integer
                nullable: true
              spans:
                type: array
                items:
                  type: object
                  properties:
                    start:
                      type: integer
                    end:
                      type: integer
              verses:
                type: array
                items:
                  type: integer
              scope:
                type: string
                enum: [BOOK, CHAPTER, VERSE, VERSE_RANGE, VERSE_SET]
              referenceLabel:
                type: string
                example: John 3:16–18, 21
              references:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    title:
                      type: string
                    author:
                      type: string
                      nullable: true
                    typeId:
                      type: integer
                    typeName:
                      type: string
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
  '400':
    description: Validation error
  '500':
    description: Server error
