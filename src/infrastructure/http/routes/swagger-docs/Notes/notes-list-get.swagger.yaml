summary: List notes for a user, optionally filtered by scripture location
parameters:
  - name: userId
    in: query
    required: true
    schema:
      type: integer
  - name: book
    in: query
    required: false
    schema:
      type: string
  - name: chapter
    in: query
    required: false
    schema:
      type: integer
  - name: scope
    in: query
    required: false
    schema:
      type: string
      enum: [BOOK, CHAPTER, VERSE, VERSE_RANGE]
responses:
  '200':
    description: Notes newest first
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              userId:
                type: integer
              content:
                type: string
              bookName:
                type: string
              bookShortName:
                type: string
              chapter:
                type: integer
                nullable: true
              startVerse:
                type: integer
                nullable: true
              endVerse:
                type: integer
                nullable: true
              scope:
                type: string
                enum: [BOOK, CHAPTER, VERSE, VERSE_RANGE]
              referenceLabel:
                type: string
                example: John 3:16–18
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
  '400':
    description: Validation error
  '500':
    description: Server error
