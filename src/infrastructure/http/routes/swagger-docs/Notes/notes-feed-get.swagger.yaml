summary: Home feed of notes from people the viewer follows
parameters:
  - name: userId
    in: query
    required: true
    schema:
      type: integer
    description: Authenticated viewer. Only notes from accepted follows. Own notes are omitted.
  - name: limit
    in: query
    required: false
    schema:
      type: integer
      default: 50
      maximum: 100
responses:
  '200':
    description: Feed notes with author summaries
  '400':
    description: Validation error
  '500':
    description: Server error
