summary: Update note content and/or scripture target
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          content:
            type: string
          bookName:
            type: string
          bookShortName:
            type: string
          chapter:
            type: integer
            nullable: true
          startVerse:
            type: integer
            nullable: true
          endVerse:
            type: integer
            nullable: true
responses:
  '200':
    description: Updated note
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: integer
            content:
              type: string
            referenceLabel:
              type: string
            scope:
              type: string
            updatedAt:
              type: string
              format: date-time
  '400':
    description: Validation error
  '404':
    description: Note not found
  '500':
    description: Server error
