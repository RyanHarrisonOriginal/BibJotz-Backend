summary: Get a note by id
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
responses:
  '200':
    description: Note
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: integer
            userId:
              type: integer
            content:
              type: string
            bookName:
              type: string
            bookShortName:
              type: string
            chapter:
              type: integer
              nullable: true
            startVerse:
              type: integer
              nullable: true
            endVerse:
              type: integer
              nullable: true
            spans:
              type: array
              items:
                type: object
                properties:
                  start:
                    type: integer
                  end:
                    type: integer
            verses:
              type: array
              items:
                type: integer
            scope:
              type: string
              enum: [BOOK, CHAPTER, VERSE, VERSE_RANGE, VERSE_SET]
            referenceLabel:
              type: string
              example: John 3:16–18, 21
            references:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  title:
                    type: string
                  author:
                    type: string
                    nullable: true
                  typeId:
                    type: integer
                  typeName:
                    type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
  '404':
    description: Note not found
  '500':
    description: Server error
