summary: Create a note on a verse, range, verse set, chapter, or book
description: |
  Scope is derived from the scripture fields:
  - book only → BOOK
  - book + chapter → CHAPTER
  - verses: [16] or startVerse → VERSE
  - contiguous verses → VERSE_RANGE
  - non-contiguous verses (e.g. [16, 18, 21]) → VERSE_SET

  Prefer `verses`. Contiguous numbers are compressed into ranges in `referenceLabel`
  (`John 3:16–18, 21`).
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [userId, content, bookName, bookShortName]
        properties:
          userId:
            type: integer
          content:
            type: string
          bookName:
            type: string
          bookShortName:
            type: string
          chapter:
            type: integer
            nullable: true
          startVerse:
            type: integer
            nullable: true
          endVerse:
            type: integer
            nullable: true
          verses:
            type: array
            items:
              type: integer
            description: Selected verse numbers in the chapter. May be non-contiguous.
          referenceIds:
            type: array
            items:
              type: integer
            description: Library reference ids to tag onto the note.
responses:
  '201':
    description: Note created
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: integer
            userId:
              type: integer
            content:
              type: string
            bookName:
              type: string
            bookShortName:
              type: string
            chapter:
              type: integer
              nullable: true
            startVerse:
              type: integer
              nullable: true
            endVerse:
              type: integer
              nullable: true
            spans:
              type: array
              items:
                type: object
                properties:
                  start:
                    type: integer
                  end:
                    type: integer
            verses:
              type: array
              items:
                type: integer
            scope:
              type: string
              enum: [BOOK, CHAPTER, VERSE, VERSE_RANGE, VERSE_SET]
            referenceLabel:
              type: string
              example: John 3:16–18, 21
            references:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  title:
                    type: string
                  author:
                    type: string
                    nullable: true
                  typeId:
                    type: integer
                  typeName:
                    type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
  '400':
    description: Validation error
  '500':
    description: Server error
