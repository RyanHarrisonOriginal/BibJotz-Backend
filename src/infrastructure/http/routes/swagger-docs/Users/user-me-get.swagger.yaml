summary: Get the authenticated user's profile
description: >-
  Requires an Authorization Bearer Clerk session JWT.
  Returns the DB user linked to the token subject.
responses:
  '200':
    description: Current user
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: integer
            displayName:
              type: string
            clerkUserId:
              type: string
              nullable: true
            username:
              type: string
              nullable: true
            bio:
              type: string
              nullable: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            followPolicy:
              type: string
              enum: [OPEN, APPROVAL]
            followListsPublic:
              type: boolean
            pendingRequestCount:
              type: integer
  '401':
    description: Missing token or user not provisioned
