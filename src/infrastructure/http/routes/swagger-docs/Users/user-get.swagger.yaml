summary: Get a user by id
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
responses:
  '200':
    description: User
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: integer
            displayName:
              type: string
            username:
              type: string
              nullable: true
            bio:
              type: string
              nullable: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            followerCount:
              type: integer
              description: Accepted followers only
            followingCount:
              type: integer
              description: Accepted follows only
            followPolicy:
              type: string
              enum: [OPEN, APPROVAL]
            viewerFollowStatus:
              type: string
              enum: [NONE, PENDING, ACCEPTED]
              description: The caller's follow of this user
  '404':
    description: User not found
  '500':
    description: Server error
