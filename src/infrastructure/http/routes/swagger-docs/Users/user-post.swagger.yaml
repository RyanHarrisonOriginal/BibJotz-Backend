summary: Ensure the authenticated Clerk user has a local DB row
description: |
  Requires `Authorization: Bearer <Clerk session JWT>`.
  Links (or creates) a `users` row by the token subject (`clerk_user_id`).
  Client-supplied `clerkUserId` is ignored; identity always comes from the JWT.
requestBody:
  required: false
  content:
    application/json:
      schema:
        type: object
        properties:
          displayName:
            type: string
            default: Reader
          username:
            type: string
            nullable: true
          bio:
            type: string
            nullable: true
responses:
  '200':
    description: Existing or newly created user for this Clerk account
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: integer
            displayName:
              type: string
            clerkUserId:
              type: string
              nullable: true
            username:
              type: string
              nullable: true
            bio:
              type: string
              nullable: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
  '401':
    description: Missing or invalid Clerk token
  '500':
    description: Server error
