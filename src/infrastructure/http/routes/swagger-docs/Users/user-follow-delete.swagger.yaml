summary: Unfollow a user
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
    description: User to unfollow
  - name: followerId
    in: query
    required: true
    schema:
      type: integer
responses:
  '204':
    description: Unfollowed
  '400':
    description: Validation error
  '404':
    description: Follow not found
  '500':
    description: Server error
