summary: Unfollow a user
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
    description: User to unfollow
  - name: followerId
    in: query
    required: true
    schema:
      type: integer
responses:
  '204':
    description: Follow or pending request removed, including when none existed
  '400':
    description: Validation error
