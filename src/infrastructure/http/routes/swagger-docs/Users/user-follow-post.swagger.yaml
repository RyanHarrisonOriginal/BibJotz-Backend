summary: Follow a user
description: >
  An OPEN account is followed immediately (ACCEPTED). An APPROVAL account creates a PENDING request.
  Repeating the request returns the existing row and does not change its status.
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
    description: User to follow
responses:
  '201':
    description: Follow or request created
  '200':
    description: Existing follow returned unchanged
  '400':
    description: Cannot follow yourself
  '404':
    description: User not found

