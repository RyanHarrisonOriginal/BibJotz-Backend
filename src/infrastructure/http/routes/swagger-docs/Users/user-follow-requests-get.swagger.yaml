summary: List incoming follow requests
description: Pending requests to the authenticated user, newest first. Keyset pagination uses createdAt and id.
parameters:
  - name: limit
    in: query
    schema:
      type: integer
      default: 20
      maximum: 50
  - name: cursorCreatedAt
    in: query
    schema:
      type: string
      format: date-time
  - name: cursorId
    in: query
    schema:
      type: integer
responses:
  '200':
    description: Pending requests
    content:
      application/json:
        schema:
          type: object
          properties:
            requests:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  followerId:
                    type: integer
                  displayName:
                    type: string
                  username:
                    type: string
                    nullable: true
                  status:
                    type: string
                    enum: [PENDING]
                  createdAt:
                    type: string
                    format: date-time
            nextCursor:
              nullable: true
              type: object
              properties:
                createdAt:
                  type: string
                  format: date-time
                id:
                  type: integer
  '400':
    description: Validation error
