summary: Update your own profile fields
description: Requires auth. You can only patch your own `id`. `clerkUserId` cannot be changed via this endpoint.
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          displayName:
            type: string
          username:
            type: string
            nullable: true
          bio:
            type: string
            nullable: true
            maxLength: 280
responses:
  '200':
    description: Updated user
  '400':
    description: Validation error
  '401':
    description: Unauthorized
  '403':
    description: Not your profile
  '404':
    description: User not found
  '500':
    description: Server error
