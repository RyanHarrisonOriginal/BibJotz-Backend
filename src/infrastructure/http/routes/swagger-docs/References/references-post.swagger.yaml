summary: Add a work to the reference library
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [userId, typeId, title]
        properties:
          userId:
            type: integer
          typeId:
            type: integer
          title:
            type: string
            example: Morning and Evening
          author:
            type: string
            nullable: true
            example: Charles Spurgeon
responses:
  '201':
    description: Reference created
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: integer
            userId:
              type: integer
            typeId:
              type: integer
            typeName:
              type: string
            title:
              type: string
            author:
              type: string
              nullable: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
  '400':
    description: Validation error
  '404':
    description: Reference type not found
  '500':
    description: Server error
