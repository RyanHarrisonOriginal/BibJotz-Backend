summary: Update a library reference
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          typeId:
            type: integer
          title:
            type: string
          author:
            type: string
            nullable: true
responses:
  '200':
    description: Updated reference
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: integer
            typeId:
              type: integer
            typeName:
              type: string
            title:
              type: string
            author:
              type: string
              nullable: true
            updatedAt:
              type: string
              format: date-time
  '400':
    description: Validation error
  '404':
    description: Reference or type not found
  '500':
    description: Server error
