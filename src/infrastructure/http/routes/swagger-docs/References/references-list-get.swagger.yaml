summary: List library references for a user
parameters:
  - name: userId
    in: query
    required: true
    schema:
      type: integer
  - name: typeId
    in: query
    required: false
    schema:
      type: integer
responses:
  '200':
    description: References A–Z
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              userId:
                type: integer
              typeId:
                type: integer
              typeName:
                type: string
              title:
                type: string
              author:
                type: string
                nullable: true
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
  '400':
    description: Validation error
  '500':
    description: Server error
