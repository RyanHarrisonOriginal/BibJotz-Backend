summary: Rename a reference type
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [name]
        properties:
          name:
            type: string
responses:
  '200':
    description: Updated type
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            updatedAt:
              type: string
              format: date-time
  '400':
    description: Validation error
  '404':
    description: Type not found
  '500':
    description: Server error
