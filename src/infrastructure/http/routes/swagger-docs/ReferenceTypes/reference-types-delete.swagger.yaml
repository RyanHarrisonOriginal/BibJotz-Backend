summary: Delete a reference type
description: Fails if any library references still use this type.
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
responses:
  '204':
    description: Type deleted
  '400':
    description: Type is still in use
  '404':
    description: Type not found
  '500':
    description: Server error
