openapi: 3.0.0
info:
  title: BibJotz API
  version: 1.0.0
  description: Bible reading and note-taking API. Scripture corpus plus user notes on verses, ranges, verse sets, chapters, and books. Includes community follows, feed sharing, and comments.

tags:
  - name: Bible
    description: Books, chapters, verses, and translations
  - name: Notes
    description: User notes attached to scripture
  - name: Comments
    description: Comments on shared or profile-visible notes
  - name: ReferenceTypes
    description: Categories for non-biblical works (devotional, commentary, custom)
  - name: References
    description: Inventory of devotionals, commentaries, and other works to tag onto notes
  - name: Users
    description: Local reader identity, profiles, and follows

paths:
  /api/v1/bible/translations:
    get:
      tags:
        - Bible
      $ref: './infrastructure/http/routes/swagger-docs/Bible/bible-translations-get.swagger.yaml'
  /api/v1/bible/books:
    get:
      tags:
        - Bible
      $ref: './infrastructure/http/routes/swagger-docs/Bible/bible-books-get.swagger.yaml'
  /api/v1/bible/books/{bookName}:
    get:
      tags:
        - Bible
      $ref: './infrastructure/http/routes/swagger-docs/Bible/bible-book-get.swagger.yaml'
  /api/v1/bible/books/{bookName}/chapters/{chapterNumber}:
    get:
      tags:
        - Bible
      $ref: './infrastructure/http/routes/swagger-docs/Bible/bible-chapter-get.swagger.yaml'
  /api/v1/bible/books/{bookName}/chapters/{chapterNumber}/verses:
    get:
      tags:
        - Bible
      $ref: './infrastructure/http/routes/swagger-docs/Bible/bible-passage-get.swagger.yaml'
  /api/v1/notes:
    get:
      tags:
        - Notes
      $ref: './infrastructure/http/routes/swagger-docs/Notes/notes-list-get.swagger.yaml'
    post:
      tags:
        - Notes
      $ref: './infrastructure/http/routes/swagger-docs/Notes/notes-post.swagger.yaml'
  /api/v1/notes/streak:
    get:
      tags:
        - Notes
      $ref: './infrastructure/http/routes/swagger-docs/Notes/notes-streak-get.swagger.yaml'
  /api/v1/notes/feed:
    get:
      tags:
        - Notes
      $ref: './infrastructure/http/routes/swagger-docs/Notes/notes-feed-get.swagger.yaml'
  /api/v1/notes/{id}:
    get:
      tags:
        - Notes
      $ref: './infrastructure/http/routes/swagger-docs/Notes/notes-get.swagger.yaml'
    patch:
      tags:
        - Notes
      $ref: './infrastructure/http/routes/swagger-docs/Notes/notes-patch.swagger.yaml'
    delete:
      tags:
        - Notes
      $ref: './infrastructure/http/routes/swagger-docs/Notes/notes-delete.swagger.yaml'
  /api/v1/notes/{id}/references:
    post:
      tags:
        - Notes
      $ref: './infrastructure/http/routes/swagger-docs/Notes/notes-tag-post.swagger.yaml'
  /api/v1/notes/{id}/references/{referenceId}:
    delete:
      tags:
        - Notes
      $ref: './infrastructure/http/routes/swagger-docs/Notes/notes-untag-delete.swagger.yaml'
  /api/v1/notes/{id}/comments:
    get:
      tags:
        - Comments
      $ref: './infrastructure/http/routes/swagger-docs/Comments/comments-list-get.swagger.yaml'
    post:
      tags:
        - Comments
      $ref: './infrastructure/http/routes/swagger-docs/Comments/comments-post.swagger.yaml'
  /api/v1/comments/{id}:
    delete:
      tags:
        - Comments
      $ref: './infrastructure/http/routes/swagger-docs/Comments/comments-delete.swagger.yaml'
  /api/v1/reference-types:
    get:
      tags:
        - ReferenceTypes
      $ref: './infrastructure/http/routes/swagger-docs/ReferenceTypes/reference-types-list-get.swagger.yaml'
    post:
      tags:
        - ReferenceTypes
      $ref: './infrastructure/http/routes/swagger-docs/ReferenceTypes/reference-types-post.swagger.yaml'
  /api/v1/reference-types/{id}:
    patch:
      tags:
        - ReferenceTypes
      $ref: './infrastructure/http/routes/swagger-docs/ReferenceTypes/reference-types-patch.swagger.yaml'
    delete:
      tags:
        - ReferenceTypes
      $ref: './infrastructure/http/routes/swagger-docs/ReferenceTypes/reference-types-delete.swagger.yaml'
  /api/v1/references:
    get:
      tags:
        - References
      $ref: './infrastructure/http/routes/swagger-docs/References/references-list-get.swagger.yaml'
    post:
      tags:
        - References
      $ref: './infrastructure/http/routes/swagger-docs/References/references-post.swagger.yaml'
  /api/v1/references/{id}:
    get:
      tags:
        - References
      $ref: './infrastructure/http/routes/swagger-docs/References/references-get.swagger.yaml'
    patch:
      tags:
        - References
      $ref: './infrastructure/http/routes/swagger-docs/References/references-patch.swagger.yaml'
    delete:
      tags:
        - References
      $ref: './infrastructure/http/routes/swagger-docs/References/references-delete.swagger.yaml'
  /api/v1/users/me:
    post:
      tags:
        - Users
      $ref: './infrastructure/http/routes/swagger-docs/Users/user-post.swagger.yaml'
    get:
      tags:
        - Users
      $ref: './infrastructure/http/routes/swagger-docs/Users/user-me-get.swagger.yaml'
  /api/v1/users:
    post:
      tags:
        - Users
      $ref: './infrastructure/http/routes/swagger-docs/Users/user-post.swagger.yaml'
  /api/v1/users/{id}:
    get:
      tags:
        - Users
      $ref: './infrastructure/http/routes/swagger-docs/Users/user-get.swagger.yaml'
    patch:
      tags:
        - Users
      $ref: './infrastructure/http/routes/swagger-docs/Users/user-patch.swagger.yaml'
  /api/v1/users/{id}/notes:
    get:
      tags:
        - Users
      $ref: './infrastructure/http/routes/swagger-docs/Users/user-notes-get.swagger.yaml'
  /api/v1/users/{id}/follow:
    post:
      tags:
        - Users
      $ref: './infrastructure/http/routes/swagger-docs/Users/user-follow-post.swagger.yaml'
    delete:
      tags:
        - Users
      $ref: './infrastructure/http/routes/swagger-docs/Users/user-follow-delete.swagger.yaml'
  /api/v1/users/{id}/followers:
    get:
      tags:
        - Users
      $ref: './infrastructure/http/routes/swagger-docs/Users/user-followers-get.swagger.yaml'
  /api/v1/users/{id}/following:
    get:
      tags:
        - Users
      $ref: './infrastructure/http/routes/swagger-docs/Users/user-following-get.swagger.yaml'
